# The hosted server (spec 2 S1). Every secret is set with `fly secrets set`, never here.
# Deploy from the repository root:
#   fly deploy . --config deploy/fly.server.toml --dockerfile deploy/Dockerfile --ha=false
# One machine only: the sweeper and the preview render queue live in the server's memory.
app = "repowiki"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "server"

[env]
  REPOWIKI_MODE = "production"
  PORT = "8787"
  INTERNAL_PORT = "8788"
  HOST = "0.0.0.0"

# Only the public port is a service. Workers reach 8788 over the private network as
# http://repowiki.internal:8788 (the INTERNAL_URL secret); Fly's proxy never routes to it.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
