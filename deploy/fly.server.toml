# The hosted server (spec 2 S1). Every secret is set with `fly secrets set`, never here.
# Deploy from the repository root, naming the commit as the engine version workers report
# (production refuses to start without REPOWIKI_ENGINE_VERSION; it is not pinned below, where
# it would go stale):
#   fly deploy . --config deploy/fly.server.toml --dockerfile deploy/Dockerfile --ha=false --env REPOWIKI_ENGINE_VERSION=$(git rev-parse --short HEAD)
# One machine only: the sweeper and the preview render queue live in the server's memory.
# Two hostnames point at this app (ADR-0012), each with its own certificate (`fly certs add`):
# APP_ORIGIN (https://app.repowiki.app: sign-in, dashboard, review) and PUBLIC_ORIGIN
# (https://repowiki.app: public pages, their wikis and previews). Both are required in
# production, on different hosts, and neither may be a *.fly.dev origin; routing is by Host,
# and any other host gets a 404. The GitHub OAuth app's callback is
# https://app.repowiki.app/auth/github/callback.
app = "repowiki"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "server"

[env]
  REPOWIKI_MODE = "production"
  PORT = "8787"
  INTERNAL_PORT = "8788"
  HOST = "0.0.0.0"

# Only the public port is a service. Workers reach 8788 over the private network as
# http://repowiki.internal:8788 (the INTERNAL_URL secret); Fly's proxy never routes to it.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # /healthz answers "ok" on any host, before host routing (every other path is 404 on a host
  # the server does not serve), so the check needs no hostname.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
